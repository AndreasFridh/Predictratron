name: Test Predictratron
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictratron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictratron/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js && node --check app/static/flow.js
      - run: docker build --build-arg BUILD_ARCH=amd64 -t predictratron:test .
      - name: Verify standalone container
        run: |
          docker run -d --name predictratron-test -p 127.0.0.1:8080:8080 predictratron:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs predictratron-test
          exit 1
