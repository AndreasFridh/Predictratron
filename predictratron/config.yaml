name: Predictratron
version: "0.2.0"
slug: predictratron
description: Train independent time-series models and predict future values with a visual signal editor.
url: https://github.com/AndreasFridh/Predictratron
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:chart-timeline-variant
panel_title: Predictratron
panel_admin: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8080]/health
backup: cold
stage: experimental
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
