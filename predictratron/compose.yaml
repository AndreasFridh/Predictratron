services:
  predictor:
    build:
      context: .
      args:
        APP_BUILD: ${APP_BUILD:-release}
    image: predictratron:0.4.0
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - predictor-data:/data
    restart: unless-stopped

volumes:
  predictor-data:
